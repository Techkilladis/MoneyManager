name: CI/CD Pipeline - PR Merge to Build & Update

on:
  pull_request:
    branches:
      - main
    types:
      - closed
  workflow_dispatch:
    inputs:
      force_build_type:
        description: 'Build type to run (detect, native, ota)'
        required: false
        default: 'detect'
        type: choice
        options:
          - detect
          - native
          - ota
      pr_number:
        description: 'PR number to comment on (optional)'
        required: false
        type: string

permissions:
  contents: write       # For creating GitHub Releases
  pull-requests: write  # For posting PR comments

jobs:
  # STEP 1: Detect what changed in the merged PR
  detect-changes:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    outputs:
      has-native-changes: ${{ steps.changed.outputs.native_any }}
      version: ${{ steps.version.outputs.version }}
      version-code: ${{ steps.version.outputs.version_code }}
      tag: ${{ steps.version.outputs.tag }}
      js-version: ${{ steps.version.outputs['js-version'] }}
      native-version: ${{ steps.version.outputs['native-version'] }}
      pr-title: ${{ steps.pr-info.outputs.title }}
      pr-body: ${{ steps.pr-info.outputs.body }}
      pr-user: ${{ steps.pr-info.outputs.user }}
      merge-commit: ${{ steps.commit.outputs.sha }}
      pr-number: ${{ steps.pr-info.outputs.pr_number }}
    steps:
      - name: Checkout merged main
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.ref || 'main' }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Get merge commit
        id: commit
        run: |
          SHA=$(git rev-parse HEAD)
          echo "sha=$SHA" >> $GITHUB_OUTPUT

      # Auto-detect: native vs JS-only changes
      - name: Check for native module changes
        id: changed
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ "${{ inputs.force_build_type }}" = "native" ]; then
              echo "native_any=true" >> $GITHUB_OUTPUT
              echo "Manual native build requested."
              exit 0
            elif [ "${{ inputs.force_build_type }}" = "ota" ]; then
              echo "native_any=false" >> $GITHUB_OUTPUT
              echo "Manual OTA update requested."
              exit 0
            fi
          fi

          BASE_COMMIT="HEAD^1"
          NATIVE_FILES=$(git diff --name-only "$BASE_COMMIT" HEAD -- modules/ android/ ios/ app.json eas.json plugins/ package.json 2>/dev/null || true)
          if [ -n "$NATIVE_FILES" ]; then
            echo "native_any=true" >> $GITHUB_OUTPUT
            echo "Native changes detected:"
            echo "$NATIVE_FILES"
          else
            echo "native_any=false" >> $GITHUB_OUTPUT
            echo "No native changes detected."
          fi

      # Version bump and manifest commit (for native changes) or version extraction (for JS changes)
      - name: Process versioning
        id: version
        run: |
          LATEST_COMMIT_MSG=$(git log -1 --pretty=%B)
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [[ "$LATEST_COMMIT_MSG" =~ ^chore\(release\):\ bump\ version ]]; then
            echo "Current commit is already bumped or running via manual dispatch. Extracting current version..."
            node scripts/bump-version.js --current
            VERSION=$(node -p "require('./package.json').version")
            TAG="v$VERSION"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            if ! git rev-parse "$TAG" >/dev/null 2>&1; then
              git tag -a "$TAG" -m "chore(release): $TAG [skip ci]"
            fi
            # Push tag if missing on remote with retry
            if ! git ls-remote --tags origin "$TAG" | grep -q "$TAG"; then
              MAX_RETRIES=3
              RETRY=0
              until git push origin "$TAG"; do
                RETRY=$((RETRY + 1))
                if [ "$RETRY" -ge "$MAX_RETRIES" ]; then
                  echo "Failed to push tag $TAG after $MAX_RETRIES attempts."
                  exit 1
                fi
                echo "Tag push failed (attempt $RETRY/$MAX_RETRIES). Retrying in 5 seconds..."
                sleep 5
              done
            fi
          elif [ "${{ steps.changed.outputs.native_any }}" = "true" ]; then
            echo "Native changes detected. Bumping version manifests..."
            node scripts/bump-version.js
            VERSION=$(node -p "require('./package.json').version")
            TAG="v$VERSION"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add app.json package.json
            if [ -f package-lock.json ]; then
              git add package-lock.json
            fi
            git commit -m "chore(release): bump version to $VERSION [skip ci]"
            git tag -a "$TAG" -m "chore(release): $TAG [skip ci]"

            # Atomic push of branch and tag with retry
            MAX_RETRIES=3
            RETRY=0
            until git push --atomic origin HEAD:main "$TAG"; do
              RETRY=$((RETRY + 1))
              if [ "$RETRY" -ge "$MAX_RETRIES" ]; then
                echo "Failed to atomic push HEAD:main and $TAG after $MAX_RETRIES attempts."
                exit 1
              fi
              echo "Atomic push failed (attempt $RETRY/$MAX_RETRIES). Retrying in 5 seconds..."
              sleep 5
            done
          else
            echo "No native changes detected. Extracting current version..."
            node scripts/bump-version.js --current
          fi

      # PR metadata
      - name: PR info
        id: pr-info
        run: |
          PR_NUM="${{ inputs.pr_number }}"
          if [ -z "$PR_NUM" ] && [ -n "$GITHUB_EVENT_PATH" ]; then
            PR_NUM=$(jq -r '.pull_request.number // ""' "$GITHUB_EVENT_PATH" 2>/dev/null || echo "")
          fi
          echo "pr_number=$PR_NUM" >> $GITHUB_OUTPUT

          # Use jq to safely read from GITHUB_EVENT_PATH (avoids shell injection from backticks in PR body)
          TITLE=$(jq -r '.pull_request.title // ""' "$GITHUB_EVENT_PATH" 2>/dev/null || echo "${{ github.event.pull_request.title }}")
          BODY=$(jq -r '.pull_request.body // ""' "$GITHUB_EVENT_PATH" 2>/dev/null || echo "")
          # Sanitize title: keep only alphanumeric, spaces, dashes, dots
          echo "title=${TITLE//[^a-zA-Z0-9 \-\.]/}" >> $GITHUB_OUTPUT
          # Sanitize body: replace newlines with spaces, limit length
          SAFE_BODY=$(printf '%s' "${BODY:0:500}" | tr '\n\r' '  ')
          echo "body=$SAFE_BODY" >> $GITHUB_OUTPUT
          echo "user=${{ github.actor }}" >> $GITHUB_OUTPUT

      - name: Log detection result
        run: |
          echo "=== CI/CD Detection Result ==="
          echo "Native changes: ${{ steps.changed.outputs.native_any }}"
          echo "Version: ${{ steps.version.outputs.version }}"
          echo "Version code: ${{ steps.version.outputs.version_code }}"
          echo "Tag: ${{ steps.version.outputs.tag }}"
          echo "Merge commit: ${{ steps.commit.outputs.sha }}"

  # STEP 2A: OTA Update (JS-only changes)
  ota-update:
    needs: detect-changes
    if: needs.detect-changes.outputs.has-native-changes == 'false'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.ref || 'main' }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install EAS CLI
        run: npm install -g eas-cli@latest

      # Authenticate with EAS via EXPO_TOKEN environment variable
      - name: EAS login
        env:
          EXPO_TOKEN: ${{ secrets.EAS_ACCESS_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::EAS_ACCESS_TOKEN secret is not set"
            exit 1
          fi
          echo "EAS authenticated via EXPO_TOKEN environment variable"

      # Typecheck before publishing to catch bundling errors early
      - name: Typecheck codebase
        run: npx tsc --noEmit

      # Lint before publishing
      - name: Lint codebase
        run: npx eslint . --max-warnings=0

      # Ensure production channel is mapped to a branch
      - name: Ensure production channel exists
        id: channel-check
        env:
          EXPO_TOKEN: ${{ secrets.EAS_ACCESS_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::EAS_ACCESS_TOKEN secret is not set"
            exit 1
          fi

          # First, try to create the channel if it doesn't exist
          npx eas-cli@latest channel:create production --non-interactive 2>&1 || true

          # Try to get the current branch mapping for production channel
          CHANNEL_INFO=$(npx eas-cli@latest channel:info production --non-interactive 2>&1) || true

          if echo "$CHANNEL_INFO" | grep -qi "branch"; then
            echo "Production channel is already mapped."
            echo "mapped=true" >> $GITHUB_OUTPUT
          else
            echo "Production channel not mapped to a branch. Creating mapping..."
            # Map production channel to main branch
            npx eas-cli@latest channel:edit production --branch main --non-interactive 2>&1 || true
            echo "mapped=true" >> $GITHUB_OUTPUT
          fi

      # Publish OTA update to production channel
      - name: Publish OTA update
        id: ota
        env:
          EXPO_TOKEN: ${{ secrets.EAS_ACCESS_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::EAS_ACCESS_TOKEN secret is not set"
            exit 1
          fi

          # Run eas update with verbose output for debugging
          echo "Publishing OTA update to production channel..."
          set -o pipefail
          RESULT=$(npx eas-cli@latest update --auto --channel production --non-interactive 2>&1) || {
            echo "::error::EAS update failed. Full output:"
            echo "$RESULT" | while IFS= read -r line; do
              echo "::warning:: $line"
            done
            exit 1
          }
          echo "$RESULT"

          # Extract the update group ID from output
          GROUP_ID=$(echo "$RESULT" | grep -oP 'group[":\s]+\K[a-f0-9]+' | head -1 || echo "unknown")
          echo "group_id=$GROUP_ID" >> $GITHUB_OUTPUT

      # Post OTA success comment on merged PR
      - name: Post OTA update comment
        if: needs.detect-changes.outputs.pr-number != ''
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const prNumber = parseInt('${{ needs.detect-changes.outputs.pr-number }}', 10);
            if (!prNumber) return;
            const groupId = '${{ steps.ota.outputs.group_id }}';
            const version = '${{ needs.detect-changes.outputs.version }}';
            const user = '${{ needs.detect-changes.outputs.pr-user }}';

            const comment = [
              `## OTA Update Published \u2728`,
              ``,
              `An Over-the-Air update has been published to the **production** channel.`,
              ``,
              `\`>\` **Version**: v${version}  \u2022  **Group**: \`${groupId}\``,
              `\`>\` **Triggered by**: @${user}`,
              ``,
              `Your friends will see "Update available - restart now?" on next app launch.`,
              ``,
              `---`,
              `_Automated by CI/CD pipeline_`
            ].join('\n');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              body: comment
            });

  # STEP 2B: Native Rebuild (native module changes)
  native-build:
    needs: detect-changes
    if: needs.detect-changes.outputs.has-native-changes == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.ref || 'main' }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Expo Prebuild (Continuous Native Generation)
        run: |
          set -o pipefail
          npx expo prebuild --platform android --clean

      - name: Validate Keystore Secrets
        id: validate-keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          node scripts/validate-keystore-secrets.js

      - name: Assemble Release APK via Gradle
        id: assemble-apk
        env:
          ANDROID_KEYSTORE_PATH: ${{ steps.validate-keystore.outputs.keystore_path }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -o pipefail
          cd android
          ./gradlew assembleRelease --no-daemon

      - name: Stage & Verify Compiled APK
        id: stage-apk
        env:
          RELEASE_TAG: ${{ needs.detect-changes.outputs.tag }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          node scripts/download-build-artifact.js \
            --local-apk android/app/build/outputs/apk/release/app-release.apk \
            --tag "${{ needs.detect-changes.outputs.tag }}" \
            --output "${{ github.workspace }}/MoneyManager-${{ needs.detect-changes.outputs.tag }}.apk"

      - name: Verify APK Signature & Schemes
        env:
          APK_PATH: ${{ steps.stage-apk.outputs.apk_path }}
        run: |
          echo "Verifying APK signature schemes (v1/v2) and certificates..."
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner 2>/dev/null | sort -V | tail -n 1 || true)
          if [ -n "$APKSIGNER" ] && [ -x "$APKSIGNER" ]; then
            "$APKSIGNER" verify --verbose --print-certs "$APK_PATH"
          else
            echo "apksigner not found in build-tools, falling back to PATH apksigner"
            apksigner verify --verbose --print-certs "$APK_PATH"
          fi

      - name: Clean up ephemeral keystore
        if: always()
        run: |
          node scripts/validate-keystore-secrets.js --cleanup android/app/release.keystore || true

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-android
          path: ${{ steps.stage-apk.outputs.apk_path }}
          retention-days: 30

      - name: Create GitHub Release
        id: create-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.detect-changes.outputs.tag }}
          name: "Release ${{ needs.detect-changes.outputs.tag }}"
          body: |
            ## Native APK Release

            > **Triggered by**: @${{ needs.detect-changes.outputs.pr-user }}
            > **Merge commit**: ${{ needs.detect-changes.outputs.merge-commit }}
            > **PR**: #${{ needs.detect-changes.outputs.pr-number || 'N/A' }}
            > **Version Code**: ${{ needs.detect-changes.outputs.version-code }}

            This release contains a full native Android build with updated native modules.

            ### How to update
            1. Download the APK below
            2. Tap to install (you may need to allow "Install from unknown sources")
            3. Your data is preserved - this is an upgrade, not a fresh install

            ---
            _Automated by CI/CD pipeline_
          files: |
            ${{ steps.stage-apk.outputs.apk_path }}
          fail_on_unmatched_files: true
          generate_release_notes: true

      - name: Post native build comment
        if: needs.detect-changes.outputs.pr-number != ''
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const prNumber = parseInt('${{ needs.detect-changes.outputs.pr-number }}', 10);
            if (!prNumber) return;
            const user = '${{ needs.detect-changes.outputs.pr-user }}';
            const version = '${{ needs.detect-changes.outputs.version }}';
            const tag = '${{ needs.detect-changes.outputs.tag }}';
            const versionCode = '${{ needs.detect-changes.outputs.version-code }}';
            const commitSha = '${{ needs.detect-changes.outputs.merge-commit }}';
            const apkFileName = '${{ steps.stage-apk.outputs.apk_filename }}' || `MoneyManager-${tag}.apk`;
            const fileSizeBytes = parseInt('${{ steps.stage-apk.outputs.apk_size }}' || '0', 10);
            let directDownloadUrl = '${{ steps.stage-apk.outputs.direct_download_url }}' || `https://github.com/${context.repo.owner}/${context.repo.repo}/releases/download/${tag}/${apkFileName}`;
            const releaseUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/releases/tag/${tag}`;

            try {
              const release = await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag: tag,
              });
              const apkAsset = release.data.assets.find(a => a.name.toLowerCase().endsWith('.apk'));
              if (apkAsset && apkAsset.browser_download_url) {
                directDownloadUrl = apkAsset.browser_download_url;
              }
            } catch (err) {
              console.log('Using deterministic release asset URL: ' + err.message);
            }

            const { formatReleaseComment } = require('./scripts/download-build-artifact');
            const comment = formatReleaseComment({
              tag,
              versionCode,
              user,
              commitSha,
              directDownloadUrl,
              releaseUrl,
              apkFileName,
              fileSizeBytes,
            });

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              body: comment
            });

