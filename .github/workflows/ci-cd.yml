name: CI/CD Pipeline - PR Merge to Build & Update

on:
  pull_request:
    branches:
      - main
    types:
      - closed

permissions:
  contents: write       # For creating GitHub Releases
  pull-requests: write  # For posting PR comments

jobs:
  # STEP 1: Detect what changed in the merged PR
  detect-changes:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    outputs:
      has-native-changes: ${{ steps.changed.outputs.native_any }}
      version: ${{ steps.version.outputs.version }}
      version-code: ${{ steps.version.outputs.version_code }}
      tag: ${{ steps.version.outputs.tag }}
      js-version: ${{ steps.version.outputs['js-version'] }}
      native-version: ${{ steps.version.outputs['native-version'] }}
      pr-title: ${{ steps.pr-info.outputs.title }}
      pr-body: ${{ steps.pr-info.outputs.body }}
      pr-user: ${{ steps.pr-info.outputs.user }}
      merge-commit: ${{ steps.commit.outputs.sha }}
    steps:
      - name: Checkout merged main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Get base commit (before PR)
        id: base
        run: |
          BASE="${{ github.event.pull_request.base.sha }}"
          echo "base=$BASE" >> $GITHUB_OUTPUT

      - name: Get merge commit
        id: commit
        run: |
          SHA=$(git rev-parse HEAD)
          echo "sha=$SHA" >> $GITHUB_OUTPUT

      # Auto-detect: native vs JS-only changes
      - name: Check for native module changes
        id: changed
        run: |
          BASE="${{ github.event.pull_request.base.sha }}"
          MERGE_BASE=$(git merge-base "$BASE" HEAD 2>/dev/null || echo "$BASE")
          NATIVE_FILES=$(git diff --name-only "$MERGE_BASE" HEAD -- modules/ android/ ios/ app.json eas.json plugins/ 2>/dev/null || true)
          if [ -n "$NATIVE_FILES" ]; then
            echo "native_any=true" >> $GITHUB_OUTPUT
            echo "Native changes detected:"
            echo "$NATIVE_FILES"
          else
            echo "native_any=false" >> $GITHUB_OUTPUT
            echo "No native changes detected."
          fi

      # Version bump and manifest commit (for native changes) or version extraction (for JS changes)
      - name: Process versioning
        id: version
        run: |
          if [ "${{ steps.changed.outputs.native_any }}" = "true" ]; then
            echo "Native changes detected. Bumping version manifests..."
            node scripts/bump-version.js
            VERSION=$(node -p "require('./package.json').version")
            TAG="v$VERSION"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add app.json package.json
            if [ -f package-lock.json ]; then
              git add package-lock.json
            fi
            git commit -m "chore(release): bump version to $VERSION [skip ci]"
            git tag "$TAG"
            git push origin main
            git push origin "$TAG"
          else
            echo "No native changes detected. Extracting current version..."
            node scripts/bump-version.js --current
          fi

      # PR metadata
      - name: PR info
        id: pr-info
        run: |
          # Use jq to safely read from GITHUB_EVENT_PATH (avoids shell injection from backticks in PR body)
          TITLE=$(jq -r '.pull_request.title' "$GITHUB_EVENT_PATH" 2>/dev/null || echo "${{ github.event.pull_request.title }}")
          BODY=$(jq -r '.pull_request.body // ""' "$GITHUB_EVENT_PATH" 2>/dev/null || echo "")
          # Sanitize title: keep only alphanumeric, spaces, dashes, dots
          echo "title=${TITLE//[^a-zA-Z0-9 \-\.]/}" >> $GITHUB_OUTPUT
          # Sanitize body: replace newlines with spaces, limit length
          SAFE_BODY=$(printf '%s' "${BODY:0:500}" | tr '\n\r' '  ')
          echo "body=$SAFE_BODY" >> $GITHUB_OUTPUT
          echo "user=${{ github.actor }}" >> $GITHUB_OUTPUT

      - name: Log detection result
        run: |
          echo "=== CI/CD Detection Result ==="
          echo "Native changes: ${{ steps.changed.outputs.native_any }}"
          echo "Version: ${{ steps.version.outputs.version }}"
          echo "Version code: ${{ steps.version.outputs.version_code }}"
          echo "Tag: ${{ steps.version.outputs.tag }}"
          echo "Merge commit: ${{ steps.commit.outputs.sha }}"

  # STEP 2A: OTA Update (JS-only changes)
  ota-update:
    needs: detect-changes
    if: needs.detect-changes.outputs.has-native-changes == 'false'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install EAS CLI
        run: npm install -g eas-cli@latest

      # Authenticate with EAS via EXPO_TOKEN environment variable
      - name: EAS login
        env:
          EXPO_TOKEN: ${{ secrets.EAS_ACCESS_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::EAS_ACCESS_TOKEN secret is not set"
            exit 1
          fi
          echo "EAS authenticated via EXPO_TOKEN environment variable"

      # Typecheck before publishing to catch bundling errors early
      - name: Typecheck codebase
        run: npx tsc --noEmit

      # Lint before publishing
      - name: Lint codebase
        run: npx eslint . --max-warnings=0

      # Ensure production channel is mapped to a branch
      - name: Ensure production channel exists
        id: channel-check
        env:
          EXPO_TOKEN: ${{ secrets.EAS_ACCESS_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::EAS_ACCESS_TOKEN secret is not set"
            exit 1
          fi

          # First, try to create the channel if it doesn't exist
          npx eas-cli@latest channel:create production --non-interactive 2>&1 || true

          # Try to get the current branch mapping for production channel
          CHANNEL_INFO=$(npx eas-cli@latest channel:info production --non-interactive 2>&1) || true

          if echo "$CHANNEL_INFO" | grep -qi "branch"; then
            echo "Production channel is already mapped."
            echo "mapped=true" >> $GITHUB_OUTPUT
          else
            echo "Production channel not mapped to a branch. Creating mapping..."
            # Map production channel to main branch
            npx eas-cli@latest channel:edit production --branch main --non-interactive 2>&1 || true
            echo "mapped=true" >> $GITHUB_OUTPUT
          fi

      # Publish OTA update to production channel
      - name: Publish OTA update
        id: ota
        env:
          EXPO_TOKEN: ${{ secrets.EAS_ACCESS_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::EAS_ACCESS_TOKEN secret is not set"
            exit 1
          fi

          # Run eas update with verbose output for debugging
          echo "Publishing OTA update to production channel..."
          set -o pipefail
          RESULT=$(npx eas-cli@latest update --auto --channel production --non-interactive 2>&1) || {
            echo "::error::EAS update failed. Full output:"
            echo "$RESULT" | while IFS= read -r line; do
              echo "::warning:: $line"
            done
            exit 1
          }
          echo "$RESULT"

          # Extract the update group ID from output
          GROUP_ID=$(echo "$RESULT" | grep -oP 'group[":\s]+\K[a-f0-9]+' | head -1 || echo "unknown")
          echo "group_id=$GROUP_ID" >> $GITHUB_OUTPUT

      # Post OTA success comment on merged PR
      - name: Post OTA update comment
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const prNumber = context.payload.pull_request.number;
            const groupId = '${{ steps.ota.outputs.group_id }}';
            const version = '${{ needs.detect-changes.outputs.version }}';
            const user = '${{ needs.detect-changes.outputs.pr-user }}';

            const comment = [
              `## OTA Update Published \u2728`,
              ``,
              `An Over-the-Air update has been published to the **production** channel.`,
              ``,
              `\`>\` **Version**: v${version}  \u2022  **Group**: \`${groupId}\``,
              `\`>\` **Triggered by**: @${user}`,
              ``,
              `Your friends will see "Update available - restart now?" on next app launch.`,
              ``,
              `---`,
              `_Automated by CI/CD pipeline_`
            ].join('\n');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              body: comment
            });

  # STEP 2B: Native Rebuild (native module changes)
  native-build:
    needs: detect-changes
    if: needs.detect-changes.outputs.has-native-changes == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install EAS CLI
        run: npm install -g eas-cli@latest

      # Authenticate with EAS via EXPO_TOKEN environment variable
      - name: EAS login
        env:
          EXPO_TOKEN: ${{ secrets.EAS_ACCESS_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::EAS_ACCESS_TOKEN secret is not set"
            exit 1
          fi
          echo "EAS authenticated via EXPO_TOKEN environment variable"

      # Daily native build cap check
      - name: Check daily build cap
        id: cap-check
        run: |
          TODAY=$(date -u +%Y-%m-%d)
          CACHE_FILE="/tmp/eas-native-build-cap"
          if [ -f "$CACHE_FILE" ]; then
            LAST_BUILD=$(cat "$CACHE_FILE")
            if [ "$LAST_BUILD" = "$TODAY" ]; then
              echo "skipped=true" >> $GITHUB_OUTPUT
              echo "::warning::Native build skipped: already built today ($TODAY)"
            else
              echo "$TODAY" > "$CACHE_FILE"
              echo "skipped=false" >> $GITHUB_OUTPUT
              echo "Native build allowed for today ($TODAY)"
            fi
          else
            echo "$TODAY" > "$CACHE_FILE"
            echo "skipped=false" >> $GITHUB_OUTPUT
            echo "First native build today ($TODAY)"
          fi

      # Build APK if cap not reached
      - name: Build Android APK (if cap not reached)
        id: eas-build
        if: steps.cap-check.outputs.skipped == 'false'
        env:
          EXPO_TOKEN: ${{ secrets.EAS_ACCESS_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::EAS_ACCESS_TOKEN secret is not set"
            exit 1
          fi
          echo "Building native APK with EAS..."
          BUILD_OUTPUT=$(npx eas-cli@latest build --platform android --profile preview --non-interactive 2>&1)
          echo "$BUILD_OUTPUT"
          BUILD_ID=$(echo "$BUILD_OUTPUT" | tail -5)
          echo "build_id=$BUILD_ID" >> $GITHUB_OUTPUT

      # Upload APK as artifact
      - name: Download and upload APK artifact
        if: steps.cap-check.outputs.skipped == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: app-release-android
          path: |
            **/*.apk
            **/*.aab
          retention-days: 30

      # Create GitHub Release with APK
      - name: Create GitHub Release
        if: steps.cap-check.outputs.skipped == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.detect-changes.outputs.tag }}
          name: "Release ${{ needs.detect-changes.outputs.tag }}"
          body: |
            ## Native APK Release

            > **Triggered by**: @${{ needs.detect-changes.outputs.pr-user }}
            > **Merge commit**: ${{ github.sha }}
            > **PR**: #${{ github.event.pull_request.number }}
            > **Version Code**: ${{ needs.detect-changes.outputs.version-code }}

            This release contains a full native Android build with updated native modules.

            ### How to update
            1. Download the APK below
            2. Tap to install (you may need to allow "Install from unknown sources")
            3. Your data is preserved - this is an upgrade, not a fresh install

            ---
            _Automated by CI/CD pipeline_
          files: |
            **/*.apk
          fail_on_unmatched_files: true
          generate_release_notes: true

      # Post native build comment on PR
      - name: Post native build comment
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const prNumber = context.payload.pull_request.number;
            const user = '${{ needs.detect-changes.outputs.pr-user }}';
            const version = '${{ needs.detect-changes.outputs.version }}';
            const tag = '${{ needs.detect-changes.outputs.tag }}';
            const releaseUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/releases/tag/${tag}`;

            let comment;
            if ('${{ steps.cap-check.outputs.skipped }}' === 'false') {
              comment = [
                `## Native APK Published \ud83e\udd16`,
                ``,
                `A full native Android build has completed and the APK is attached to a GitHub Release.`,
                ``,
                `\`>\` **Version**: ${tag}  \u2022  **Triggered by**: @${user}`,
                ``,
                `[Download APK](${releaseUrl})`,
                ``,
                `Share this link with your friends - they can tap the APK to update directly.`,
                ``,
                `---`,
                `_Automated by CI/CD pipeline_`
              ].join('\n');
            } else {
              comment = [
                `## Native Build Skipped (Daily Cap Reached) \u23f3`,
                ``,
                `A native rebuild was requested but **already completed today**.`,
                ``,
                `\`>\` **Version**: ${tag}  \u2022  **Triggered by**: @${user}`,
                ``,
                `Your friends will receive the APK update from today's build.`,
                `If a new native change is needed tomorrow, a fresh build will trigger automatically.`,
                ``,
                `---`,
                `_Automated by CI/CD pipeline_`
              ].join('\n');
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              body: comment
            });
